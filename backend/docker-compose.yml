
services:
  postgres:
    image: postgres:16
    container_name: dollarcity_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dollarcity_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dollarcity_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: dollarcity_postgres_data